/* 紙の上の水面に色水が流れる。盤を画面いっぱいに取り、文字と操作は上下の細い帯にまとめる。単一テーマ(明)。 */
:root{
  --paper:#f3f5f1;
  --water:#dce9ee;
  --water-deep:#c6d9e2;
  --ink:#27363e;
  --ink-dim:#66767e;
  --line:#b5c6ce;
  --accent:#2f74d0;
  --font-display:"Zen Kurenaido","Hiragino Maru Gothic ProN","Yu Gothic UI",sans-serif;
  --font-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);display:flex;justify-content:center;overscroll-behavior:none}
.app{width:100%;max-width:min(820px,calc(100dvh - 250px));min-width:min(100%,340px);padding:10px 12px 18px;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:400;font-size:26px;letter-spacing:.08em;margin:0}
.lv{font-size:14px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.lv b{font-family:var(--font-display);font-weight:400;font-size:19px;color:var(--ink);margin-left:8px;letter-spacing:.06em}
.tip{min-height:1.5em;margin:0;font-size:15px;line-height:1.5}
.board{position:relative;width:100%;aspect-ratio:1/1;border-radius:20px;background:linear-gradient(160deg,var(--water),var(--water-deep));
  box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.board.glow{animation:glow 1.1s ease-out}
@keyframes glow{0%{box-shadow:inset 0 0 0 1px var(--line),0 0 0 0 rgba(242,182,50,.0)}25%{box-shadow:inset 0 0 0 3px #f2b632,0 0 34px 6px rgba(242,182,50,.55)}100%{box-shadow:inset 0 0 0 1px var(--line),0 0 0 0 rgba(242,182,50,0)}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.done{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;background:rgba(243,245,241,.95);border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,1.3,.4,1)}
.done.on{transform:none}
.done strong{font-family:var(--font-display);font-weight:400;font-size:24px;letter-spacing:.06em}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.inv{display:flex;align-items:center;gap:7px;font-size:15px;color:var(--ink);flex:none}
.inv b{font-family:var(--font-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums;margin-left:2px}
.inv i{width:36px;height:36px;border-radius:50%;background:#fbfbf8;border:2px solid #8c9aa1;display:inline-block;position:relative;transition:transform .15s,opacity .15s}
.inv i::after{content:"";position:absolute;left:50%;top:50%;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid var(--ink);transform:translate(-50%,-60%)}
.inv i.used{opacity:.25;transform:scale(.8)}
.inv.deny{animation:deny .3s}
@keyframes deny{20%{transform:translateX(-6px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
button{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
button:hover{border-color:var(--ink-dim)}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink);padding:10px 22px;font-size:15px}
button:disabled{opacity:.4;cursor:default}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.mixes{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-dim);align-items:center}
.mixes i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.levels button{padding:6px 0;border-radius:10px;font-size:13px;font-variant-numeric:tabular-nums}
.levels button[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.levels button.cleared{background:var(--ink);color:#fff;border-color:var(--ink)}

// いろながし:盤面のルール(ページと面生成で共通)。向き 0=上 1=右 2=下 3=左。色は顔料の集合 赤=1 黄=2 青=4。
var Core = (function(){
  var DX = [0,1,0,-1], DY = [-1,0,1,0];
  // 種類 0=水面 1=泉 2=花 3=分かれ岩 4=黒い岩
  function prep(L){
    var n = L.w * L.h, type = new Uint8Array(n), idx = new Int16Array(n).fill(-1);
    L.sources.forEach(function(s, i){ type[s.y*L.w+s.x] = 1; idx[s.y*L.w+s.x] = i; });
    L.flowers.forEach(function(f, i){ type[f.y*L.w+f.x] = 2; idx[f.y*L.w+f.x] = i; });
    (L.splits||[]).forEach(function(s){ type[s.y*L.w+s.x] = 3; });
    (L.blocks||[]).forEach(function(s){ type[s.y*L.w+s.x] = 4; });
    return {n:n, type:type, idx:idx};
  }
  // stone[セル] = 置かれた矢印石の向き(なければ -1)
  function simulate(L, P, stone){
    var n = P.n, w = L.w, h = L.h, type = P.type;
    var color = new Uint8Array(n), out = new Uint8Array(n), inn = new Uint8Array(n), blocked = new Uint8Array(n);
    var depth = new Int16Array(n).fill(-1), recv = new Uint8Array(L.flowers.length), q = [], head = 0, i;
    for (i = 0; i < L.sources.length; i++){ var s = L.sources[i], c0 = s.y*w+s.x; color[c0] = s.p; out[c0] = 1 << s.d; depth[c0] = 0; q.push(c0); }
    while (head < q.length && head < 40000){
      var c = q[head++], x = c % w, y = (c - x) / w, col = color[c];
      for (var d = 0; d < 4; d++){
        if (!(out[c] & (1 << d))) continue;
        var nx = x + DX[d], ny = y + DY[d];
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        var m = ny*w+nx, t = type[m], nc = color[m], no = out[m];
        if (t === 0){
          var sd = stone[m];
          if (sd < 0){ nc |= col; no |= 1 << d; inn[m] |= 1 << d; }
          else if (sd === ((d + 2) & 3)){ blocked[m] = 1; if (depth[m] < 0) depth[m] = depth[c] + 1; }
          else { nc |= col; no |= 1 << sd; inn[m] |= 1 << d; }
        }
        else if (t === 3){ nc |= col; no |= (1 << ((d + 1) & 3)) | (1 << ((d + 3) & 3)); inn[m] |= 1 << d; }
        else if (t === 2){ recv[P.idx[m]] |= col; nc |= col; inn[m] |= 1 << d; }
        else { if (depth[m] < 0) depth[m] = depth[c] + 1; continue; }
        if (nc !== color[m] || no !== out[m]){ color[m] = nc; out[m] = no; if (depth[m] < 0) depth[m] = depth[c] + 1; if (t !== 2) q.push(m); }
      }
    }
    var ok = 0, bad = 0;
    for (i = 0; i < L.flowers.length; i++){ if (recv[i] === L.flowers[i].need) ok++; else if (recv[i]) bad++; }
    return {color:color, out:out, inn:inn, blocked:blocked, depth:depth, recv:recv, ok:ok, bad:bad, win:ok === L.flowers.length && ok > 0};
  }
  return {DX:DX, DY:DY, prep:prep, simulate:simulate};
})();

      ctx.strokeStyle = "rgba(39,54,62,.75)"; ctx.lineWidth = cs * .045; ctx.setLineDash([cs * .1, cs * .08]); ctx.lineDashOffset = -t * cs * .3;

}

  state:function(){ return {cur:cur, won:won, panel:panelShown, stones:stones.map(function(s){ return [s.c, s.d]; }), flowers:flowers.map(function(f){ return f.st; }), simWin:sim.win}; } };
